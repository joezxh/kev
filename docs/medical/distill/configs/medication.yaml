# 用药指导 / 医保合理性审核 —— 生成式 SFT 轨
#
#  teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#    $env:KEV_GEN_API_KEY = "..."
#    $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"   # 以 developer.ant-ling.com 为准
#
#  这个配置只产出生成式 SFT 样本。Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，不经过本流水线。
#
#  用法: easydistill --config docs/medical/distill/configs/medication.yaml
#  （Kev 轨：复用 medication-review spec，标签由 gen_medication_review.evaluate() 派生）
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash        # 以 developer.ant-ling.com/zh-CN/docs/models/ 当时可用的 model id 为准
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2               # 云端限流：宁可慢，不要触发 429

dataset:
  instruction_key: instruction
  input_file: data/seeds/medication.seed.jsonl
  output_dir: data/sft/medication

system_prompt: >-
  你是一位临床药师。回答要说明该药的适应证、用法用量、注意事项、相互作用与禁忌人群，并明确指出是否需要药师复核。不给出超出说明书范围的个体化剂量调整建议。

pipeline:
  - stage: instruction_expansion
    output: data/sft/medication/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/medication/generated.jsonl
  - stage: judge
    output: data/sft/medication/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/medication/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/medication/medication.sft.jsonl

resume: true                   # 每阶段落盘，中断后重跑不会重复消耗额度
