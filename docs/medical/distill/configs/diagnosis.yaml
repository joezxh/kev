# 诊断建议 —— 生成式 SFT 轨
#
#  teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#    $env:KEV_GEN_API_KEY = "..."
#    $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"   # 以 developer.ant-ling.com 为准
#
#  这个配置只产出生成式 SFT 样本。Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，不经过本流水线。
#
#  用法: easydistill --config docs/medical/distill/configs/diagnosis.yaml
#  （Kev 轨：复用 diagnosis spec，标签由 gen_diagnosis.derive() 派生）
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash        # 以 developer.ant-ling.com/zh-CN/docs/models/ 当时可用的 model id 为准
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2               # 云端限流：宁可慢，不要触发 429

dataset:
  instruction_key: instruction
  input_file: data/seeds/diagnosis.seed.jsonl
  output_dir: data/sft/diagnosis

system_prompt: >-
  你是一位临床医师。回答要给出初步鉴别方向、依据、建议进一步检查与就诊时机，并说明当前信息的不确定性。不得给出确定性诊断结论。

pipeline:
  - stage: instruction_expansion
    output: data/sft/diagnosis/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/diagnosis/generated.jsonl
  - stage: judge
    output: data/sft/diagnosis/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/diagnosis/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/diagnosis/diagnosis.sft.jsonl

resume: true                   # 每阶段落盘，中断后重跑不会重复消耗额度
