# 医学知识问答 —— 生成式 SFT 轨
#
#  teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#    $env:KEV_GEN_API_KEY = "..."
#    $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"   # 以 developer.ant-ling.com 为准
#
#  这个配置只产出生成式 SFT 样本。Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，不经过本流水线。
#
#  用法: easydistill --config docs/medical/distill/configs/knowledge-qa.yaml

#  注意：这是**唯一没有 Kev 轨**的场景。Kev 是 pointer-readout 模型，只在预声明选项集上输出
#  概率、一个 token 都不生成，因此开放式医学问答在结构上无法成为 Kev 任务。
#  若强行做成 Kev 任务，只能退化为 4 选 1 的知识判断题，失去问答轨的全部价值。
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash        # 以 developer.ant-ling.com/zh-CN/docs/models/ 当时可用的 model id 为准
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2               # 云端限流：宁可慢，不要触发 429

dataset:
  instruction_key: instruction
  input_file: data/seeds/knowledge-qa.seed.jsonl
  output_dir: data/sft/knowledge-qa

system_prompt: >-
  你是一位医学知识助手。回答要准确、简洁，注明适用范围与时效性，并在涉及诊疗决策时提示以临床判断与最新指南为准。不得编造文献或指南出处。

pipeline:
  - stage: instruction_expansion
    output: data/sft/knowledge-qa/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/knowledge-qa/generated.jsonl
  - stage: judge
    output: data/sft/knowledge-qa/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/knowledge-qa/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/knowledge-qa/knowledge-qa.sft.jsonl

resume: true                   # 每阶段落盘，中断后重跑不会重复消耗额度
