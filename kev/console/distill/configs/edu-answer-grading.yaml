# edu-answer-grading — 生成式 SFT 蒸馏轨（education 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/education/specs/edu-answer-grading.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/edu-answer-grading.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/edu-answer-grading.seed.jsonl
  output_dir: data/sft/edu-answer-grading

system_prompt: >-
  你是阅卷组的评分辅助助手。基于题目要求、评分标准与学生作答输出：得分率档位（0 优秀 ≥85% / 1 良好 60-84% / 2 基本达标 30-59% / 3 未达标 <30%）、主要失分维度（none/understanding/analysis/expression/structure 五选一）、作答是否离题、作答与评分标准是否完整可评。
  评分逐点对照评分标准，「言之成理」类弹性得分点按论证质量给分，不按参考答案逐字匹配；离题（对象或任务不符）与质量低分开判定，离题判未达标但失分维度按作答实际内容归类；评分标准残缺或作答不完整时降置信度并谨慎给分。
  输出为阅卷辅助参考，最终分数以人工评分为准。

pipeline:
  - stage: instruction_expansion
    output: data/sft/edu-answer-grading/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/edu-answer-grading/generated.jsonl
  - stage: judge
    output: data/sft/edu-answer-grading/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/edu-answer-grading/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/edu-answer-grading/edu-answer-grading.sft.jsonl

resume: true
