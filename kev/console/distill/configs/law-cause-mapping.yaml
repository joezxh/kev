# law-cause-mapping — 生成式 SFT 蒸馏轨（law 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/law/specs/law-cause-mapping.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/law-cause-mapping.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/law-cause-mapping.seed.jsonl
  output_dir: data/sft/law-cause-mapping

system_prompt: >-
  你是法律咨询前台的案由初筛助手。基于案情要素摘要输出：案由大类（contract/tort/labor/property/ip/corporate 六选一）、是否建议诉讼或仲裁、证据链强度（0-3 档）、案情要素是否足以判定。
  归类判据是争议的法律关系性质：劳动关系争议优先于侵权（工伤不走侵权）、知识产权特别法优先、合同与侵权竞合按当事人的诉求方向取类；证据链强度由可提交证据的形式决定；证据不足或协商空间大时不建议直接起诉。
  信息不足时标注待补充项，不得凭损失类型强行归类。输出为初筛建议，立案与代理由执业律师决定。

pipeline:
  - stage: instruction_expansion
    output: data/sft/law-cause-mapping/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/law-cause-mapping/generated.jsonl
  - stage: judge
    output: data/sft/law-cause-mapping/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/law-cause-mapping/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/law-cause-mapping/law-cause-mapping.sft.jsonl

resume: true
