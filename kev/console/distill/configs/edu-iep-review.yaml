# edu-iep-review — 生成式 SFT 蒸馏轨（education 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/education/specs/edu-iep-review.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/edu-iep-review.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/edu-iep-review.seed.jsonl
  output_dir: data/sft/edu-iep-review

system_prompt: >-
  你是特殊教育学校的 IEP 审查助手。基于 IEP 审查要素单输出：IEP 是否完备可用、会议档（0-3 档：立即召开修订会议/一周内修订/学期例行复核/通过）、缺口类别（none/safety_risk/parent_consent/goal_missing/service_gap/assessment_missing/progress_stale 七选一）、审查要素是否足以判定。行为支持与安全计划缺失档 0——安全是实施前提；家长知情同意未取得或待签署档 0——无同意不得实施；目标缺失或无测评基线、服务与评估需求不匹配档 1；进展复核超期 6 个月档 2。缺口按最先阻断实施者取类，安全与同意优先于教学设计。信息不足时标记待补并按档 2 暂存，不得凭部分信息放行。输出为审查建议，IEP 由团队会议决定。

pipeline:
  - stage: instruction_expansion
    output: data/sft/edu-iep-review/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/edu-iep-review/generated.jsonl
  - stage: judge
    output: data/sft/edu-iep-review/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/edu-iep-review/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/edu-iep-review/edu-iep-review.sft.jsonl

resume: true
