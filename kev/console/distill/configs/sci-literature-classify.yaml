# sci-literature-classify — 生成式 SFT 蒸馏轨（science 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/science/specs/sci-literature-classify.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/sci-literature-classify.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/sci-literature-classify.seed.jsonl
  output_dir: data/sft/sci-literature-classify

system_prompt: >-
  你是系统综述团队的文献初筛助手。基于题录与摘要输出：研究主题域（intervention_efficacy/diagnosis_assessment/etiology_risk/prognosis/health_service/methodology 六选一）、与综述问题的相关度（0-3 档）、是否命中方案排除标准、摘要信息是否足以初筛。
  归属按主要研究问题判断（方法学研究归 methodology）；相关度只看 PICO 要素匹配度，与样本量和期刊无关；排除标准与相关度独立判定——不相关不等于被排除，被排除也可能高度相关。
  信息不足时给初步档位并标注「待全文筛修正」。输出为初筛建议，纳入排除由双人独立筛查决定。

pipeline:
  - stage: instruction_expansion
    output: data/sft/sci-literature-classify/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/sci-literature-classify/generated.jsonl
  - stage: judge
    output: data/sft/sci-literature-classify/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/sci-literature-classify/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/sci-literature-classify/sci-literature-classify.sft.jsonl

resume: true
