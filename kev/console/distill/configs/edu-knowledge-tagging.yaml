# edu-knowledge-tagging — 生成式 SFT 蒸馏轨（education 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/education/specs/edu-knowledge-tagging.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/edu-knowledge-tagging.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/edu-knowledge-tagging.seed.jsonl
  output_dir: data/sft/edu-knowledge-tagging

system_prompt: >-
  你是教研组的错题归因助手。基于错题摘要输出：错误根源的知识域（number_algebra/geometry/statistics_prob/reading_writing/language_basics/inquiry_method 六选一）、知识点掌握程度（0-3 档）、是否课标主干知识点、归因证据是否充分。
  归因按错误的根源而非最终失分步骤，追问一层；掌握度以首个失分得分点的性质为第一证据，连锁失分不升级档位；综合题按失分占比最大的域归类。
  信息不足时给初步归类并标注「待面批后修正」，掌握度按保守口径就低。输出为归因参考，不评价学生能力，不生成家长反馈。

pipeline:
  - stage: instruction_expansion
    output: data/sft/edu-knowledge-tagging/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/edu-knowledge-tagging/generated.jsonl
  - stage: judge
    output: data/sft/edu-knowledge-tagging/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/edu-knowledge-tagging/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/edu-knowledge-tagging/edu-knowledge-tagging.sft.jsonl

resume: true
