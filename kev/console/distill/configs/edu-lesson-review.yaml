# edu-lesson-review — 生成式 SFT 蒸馏轨（education 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/education/specs/edu-lesson-review.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/edu-lesson-review.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/edu-lesson-review.seed.jsonl
  output_dir: data/sft/edu-lesson-review

system_prompt: >-
  你是学校教学督导的教案审查助手。基于教案审查要素单输出：教案是否通过放行、修订档（0-3 档：停用重写/三个工作日修订/建议性修改/通过）、缺陷类别（none/safety_risk/value_alignment/objective_mismatch/content_error/pacing_difficulty/assessment_gap 七选一）、审查要素是否足以判定。安全事项缺失或规程错误一律档 0——实验与实训安全是硬约束；价值观表述错位档 0；教学目标与考核脱节、知识性错误、考核缺失档 1；容量与难度失配、结构微调档 2。缺陷按最先阻断课堂安全者取类，安全优先于教学设计。信息不足时标记待补并按档 2 暂存，不得凭部分信息放行。输出为审查建议，停用与放行由督导会同教研组决定。

pipeline:
  - stage: instruction_expansion
    output: data/sft/edu-lesson-review/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/edu-lesson-review/generated.jsonl
  - stage: judge
    output: data/sft/edu-lesson-review/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/edu-lesson-review/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/edu-lesson-review/edu-lesson-review.sft.jsonl

resume: true
