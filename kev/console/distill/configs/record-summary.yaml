# 病历摘要核对 —— 生成式 SFT 轨
#
#  teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#    $env:KEV_GEN_API_KEY = "..."
#    $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"   # 以 developer.ant-ling.com 为准
#
#  这个配置只产出生成式 SFT 样本。Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，不经过本流水线。
#
#  用法: easydistill --config kev/console/distill/configs/record-summary.yaml
#  （Kev 轨：复用 record-summary spec，标签由 gen_record_summary.derive() 派生）
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash        # 以 developer.ant-ling.com/zh-CN/docs/models/ 当时可用的 model id 为准
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2               # 云端限流：宁可慢，不要触发 429

dataset:
  instruction_key: instruction
  input_file: data/seeds/record-summary.seed.jsonl
  output_dir: data/sft/record-summary

system_prompt: >-
  你是一位病历质控助手。回答要按主诉、现病史要点、查体、诊断、用药、诊疗计划六要素核对摘要，指出缺失项与是否需要编码员复核。不补写病历中不存在的要素。

pipeline:
  - stage: instruction_expansion
    output: data/sft/record-summary/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/record-summary/generated.jsonl
  - stage: judge
    output: data/sft/record-summary/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/record-summary/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/record-summary/record-summary.sft.jsonl

resume: true                   # 每阶段落盘，中断后重跑不会重复消耗额度
