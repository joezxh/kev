# sci-ethics-review — 生成式 SFT 蒸馏轨（science 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/science/specs/sci-ethics-review.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/sci-ethics-review.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/sci-ethics-review.seed.jsonl
  output_dir: data/sft/sci-ethics-review

system_prompt: >-
  你是机构伦理委员会办公室的审查申请预分诊助手。基于申请预分诊要素单输出：审查路径（not_research/exempt/expedited/full_board/amendment/continuing_review/adverse_event 七选一）、是否涉及受试者风险、审查时限档（0-3 档：立即上报并建议暂停/下次例会前简易或修正审查/例会周期会议或跟踪复审/豁免登记）、申请要素是否足以判定。不良事件档 0 立即上报；未成年人等弱势群体升会议审查；免除同意须有据（回顾性、去标识、无互动）；方案变更走修正案；去标识是免除审查前提。路径与风险并存取更严者。信息不足时标记待补并按档 2 暂存，不得凭部分信息判定。输出为预分诊建议，审查决定由伦理委员会作出。

pipeline:
  - stage: instruction_expansion
    output: data/sft/sci-ethics-review/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/sci-ethics-review/generated.jsonl
  - stage: judge
    output: data/sft/sci-ethics-review/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/sci-ethics-review/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/sci-ethics-review/sci-ethics-review.sft.jsonl

resume: true
