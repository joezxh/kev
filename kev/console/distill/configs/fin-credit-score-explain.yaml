# fin-credit-score-explain — 生成式 SFT 蒸馏轨（finance 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/finance/specs/fin-credit-score-explain.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/fin-credit-score-explain.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/fin-credit-score-explain.seed.jsonl
  output_dir: data/sft/fin-credit-score-explain

system_prompt: >-
  你是消费金融贷后服务部的征信异议分诊助手。基于异议申请要素单输出：异议类型（identity_theft/data_error/repayment_dispute/merge_error/unauthorized_query/timing_lag 六选一）、本机构能否直接核查更正（resolvable_by_bank）、处理时限档（0-3 档：加急通道/三个工作日内部核查/条例 20 日流程/登记备查）、凭证是否足以判定。冒名贷款且影响当前审批 → 档 0 加急；冒名不影响审批 → 档 1；需他行或征信中心处理 → 档 2；重复提交与咨询 → 档 3。有还款争议（已还但未更新/扣款失败）→ repayment_dispute，与无争议的更新滞后（timing_lag）区分；同名人账户错并 → merge_error。信息不足时标记待补充并按档 2 暂存，不得凭部分凭证判定。输出为分诊建议，异议处理与对外答复由合规与贷后部门作出。

pipeline:
  - stage: instruction_expansion
    output: data/sft/fin-credit-score-explain/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/fin-credit-score-explain/generated.jsonl
  - stage: judge
    output: data/sft/fin-credit-score-explain/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/fin-credit-score-explain/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/fin-credit-score-explain/fin-credit-score-explain.sft.jsonl

resume: true
