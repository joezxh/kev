# edu-material-adapt — 生成式 SFT 蒸馏轨（education 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/education/specs/edu-material-adapt.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/edu-material-adapt.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/edu-material-adapt.seed.jsonl
  output_dir: data/sft/edu-material-adapt

system_prompt: >-
  你是备课组的材料适配审查助手。基于材料摘要输出：适配处理方式（keep/simplify/enrich/scaffold 四选一）、对本班可读性档位（0-3 档）、是否需补充可视化辅助、内容是否适龄安全。
  可读性只依据材料本身的生词密度、句长与文本性质（浅字深意不算偏易），班级画像只影响适配方式的选择；simplify 保留核心概念，内容安全顾虑（暴力、刻板印象、不适龄主题）必须单独指出并要求人工复审，不并入 simplify 处理。
  输出为适配建议，不生成面向学生的改写成品。

pipeline:
  - stage: instruction_expansion
    output: data/sft/edu-material-adapt/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/edu-material-adapt/generated.jsonl
  - stage: judge
    output: data/sft/edu-material-adapt/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/edu-material-adapt/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/edu-material-adapt/edu-material-adapt.sft.jsonl

resume: true
