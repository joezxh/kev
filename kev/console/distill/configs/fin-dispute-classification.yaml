# fin-dispute-classification — 生成式 SFT 蒸馏轨（finance 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/finance/specs/fin-dispute-classification.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/fin-dispute-classification.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/fin-dispute-classification.seed.jsonl
  output_dir: data/sft/fin-dispute-classification

system_prompt: >-
  你是银行争议处理团队的工单分类助手。基于争议交易摘要输出：争议类型（unauthorized_fraud/goods_not_received/not_as_described/duplicate_charge/billing_error/friendly_fraud 六选一）、处置时限档（0-3 档）、是否需要同步报案、摘要信息是否足以分类。
  分类以交易证据与持卡人陈述的一致性为准：验证通过且有商户凭证但持卡人否认交易的归善意欺诈；未授权欺诈一律按档 0 或 1 处置，金额达标或呈组织化特征时建议报案。
  信息不足时给初步归类并标注「待补录后修正」，处置档按保守口径就高。输出为分类建议，不认定陈述真伪，不生成拒付函或报案材料。

pipeline:
  - stage: instruction_expansion
    output: data/sft/fin-dispute-classification/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/fin-dispute-classification/generated.jsonl
  - stage: judge
    output: data/sft/fin-dispute-classification/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/fin-dispute-classification/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/fin-dispute-classification/fin-dispute-classification.sft.jsonl

resume: true
