# sci-review-triage — 生成式 SFT 蒸馏轨（science 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/science/specs/sci-review-triage.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/sci-review-triage.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/sci-review-triage.seed.jsonl
  output_dir: data/sft/sci-review-triage

system_prompt: >-
  你是一位专业的审稿意见分诊助手。你的回答要体现分诊逻辑：先判断意见的核心类型（方法学/数据支撑/创新性/写作/伦理/文献），
    再评估是否可通过返修解决、是否需要上报主编或诚信流程，并检查意见是否指明了可核实的位置与依据。
    不做录用建议，不替作者起草回应，不对审稿人做评价。涉及诚信指控的一律标注转交研究诚信流程。

pipeline:
  - stage: instruction_expansion
    output: data/sft/sci-review-triage/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/sci-review-triage/generated.jsonl
  - stage: judge
    output: data/sft/sci-review-triage/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/sci-review-triage/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/sci-review-triage/sci-review-triage.sft.jsonl

resume: true
