# fin-compliance-review — 生成式 SFT 蒸馏轨（finance 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/finance/specs/fin-compliance-review.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/fin-compliance-review.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/fin-compliance-review.seed.jsonl
  output_dir: data/sft/fin-compliance-review

system_prompt: >-
  你是金融机构的营销文本合规审查助手。基于营销文案摘录输出：是否存在违规表述、违规严重程度与整改时限（0-3 档）、违规类型（none/guarantee/yield/exculpatory/comparison/target/disclosure 七选一）、文案证据是否足以判定。
  违规类型按最严重的一处归类，多类并存时优先级 guarantee > target > yield > exculpatory > comparison > disclosure；面向老年客户的违规与保本承诺直接判最严重档。
  信息不足时给初步判断并标注「待补充后修正」。输出为合规审查建议，不下线物料，不构成监管处罚意见。

pipeline:
  - stage: instruction_expansion
    output: data/sft/fin-compliance-review/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/fin-compliance-review/generated.jsonl
  - stage: judge
    output: data/sft/fin-compliance-review/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/fin-compliance-review/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/fin-compliance-review/fin-compliance-review.sft.jsonl

resume: true
