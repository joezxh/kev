# sci-data-sharing-review — 生成式 SFT 蒸馏轨（science 领域）
# spec（system_prompt / ask_template / topics 的唯一来源）: docs/domains/science/specs/sci-data-sharing-review.json
#
# teacher: 蚂蚁百灵云端 Open API（OpenAI 兼容）。base_url 与 api_key 从环境变量读，**不要写进本文件**。
#   $env:KEV_GEN_API_KEY = "..."
#   $env:KEV_GEN_BASE_URL = "https://<官方 base URL>/v1"
#
# 与医疗蒸馏轨（inquiry 等）的差异：本场景无规则引擎（spec.generator.module = null），种子 state 不由
# gen_*.py 采样，而由 skills/kev-finetune/scripts/generate_data.py --spec <spec 路径> 或控制台采集产出；
# Kev 决策记录由 seed_to_kev.py 从旁路 sidecar 重建，标签不来自 LLM。
#
# 用法: easydistill --config kev/console/distill/configs/sci-data-sharing-review.yaml
job_type: advanced_instruct_distill

backend:
  type: openai
  model: ling-3.0-flash
  base_url: ${KEV_GEN_BASE_URL}
  api_key: ${KEV_GEN_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  concurrency: 2

dataset:
  instruction_key: instruction
  input_file: data/seeds/sci-data-sharing-review.seed.jsonl
  output_dir: data/sft/sci-data-sharing-review

system_prompt: >-
  你是科研机构的数据共享审查助手。基于数据集摘要输出：是否可共享、共享前最小处理档位（0-3 档）、主要风险类别（none/consent_gap/reidentification/sensitive_field/regulated_group/cross_border/purpose_mismatch 七选一）、申请材料是否足以判定。
  shareable 要求同意覆盖、去标识达标与方式匹配三条件同时满足；风险按最先导致不可共享的原因取类（同意 > 受监管群体 > 跨境 > 再识别 > 涉敏字段 > 用途）；基因测序数据绝不公开共享；受控访问不豁免出境评估；小样本人群再识别评估从宽。
  信息不足时给初步判断并标注待补充项。输出为审查建议，批准决定由伦理委员会作出。

pipeline:
  - stage: instruction_expansion
    output: data/sft/sci-data-sharing-review/expanded.jsonl
    params:
      num_per_seed: 3
  - stage: generate
    output: data/sft/sci-data-sharing-review/generated.jsonl
  - stage: judge
    output: data/sft/sci-data-sharing-review/judged.jsonl
    params:
      dimensions: [correctness, helpfulness, informativeness, generalization]
      pass_score: 7
  - stage: filter
    output: data/sft/sci-data-sharing-review/filtered.jsonl
    params:
      require_correctness: true
  - stage: build_sft
    output: data/sft/sci-data-sharing-review/sci-data-sharing-review.sft.jsonl

resume: true
